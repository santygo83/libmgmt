name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1) VALIDATE — the gate. Lint HTML and check JS syntax before anything ships.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint HTML
        run: npx --yes htmlhint index.html

      - name: Check JavaScript syntax
        run: node --check js/app.js

  # ---------------------------------------------------------------------------
  # 2) DEPLOY — runs only on a real push to main (e.g. a merged PR from Dev),
  #    after validate passes. No autofix on main.
  # ---------------------------------------------------------------------------
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy site files to EC2
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "rm -rf /tmp/taskboard && mkdir -p /tmp/taskboard"
          scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no \
            -r index.html css js deploy \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:/tmp/taskboard/"

      - name: Run deploy script on EC2
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "bash /tmp/taskboard/deploy/setup_ec2.sh"
