# Nginx config for the TaskBoard static site.
#
# Amazon Linux 2023 / RHEL:  copy to /etc/nginx/conf.d/taskboard.conf
# Ubuntu/Debian:             copy to /etc/nginx/sites-available/taskboard.conf
#                            then symlink into sites-enabled/
#
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # replace with your domain or EC2 public DNS

    # Where the site files live. Copy the project here (see README).
    root /var/www/taskboard;
    index index.html;

    # Plain static serving. Fall back to index.html if a path isn't found.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets; they're safe to cache since names/content are stable.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Lightweight health check endpoint for load balancers / monitoring.
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # A few sensible security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
