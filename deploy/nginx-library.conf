# Nginx reverse proxy for the Library Management System.
#
# Amazon Linux 2023 / RHEL:  copy to /etc/nginx/conf.d/library.conf
# Ubuntu:                    copy to /etc/nginx/sites-available/library.conf
#                            then: ln -s ../sites-available/library.conf /etc/nginx/sites-enabled/
#
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # Replace with your domain or the EC2 public DNS/IP.
    server_name _;

    client_max_body_size 5M;

    # Serve static files directly from Nginx (faster than proxying to Flask).
    location /static/ {
        alias /home/ec2-user/library-management/app/static/;
        expires 7d;
        access_log off;
    }

    # Everything else goes to Gunicorn over the Unix socket.
    location / {
        proxy_pass http://unix:/run/library/library.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# For HTTPS, run certbot after this is working:
#   sudo dnf install -y certbot python3-certbot-nginx   # Amazon Linux 2023
#   sudo certbot --nginx -d your-domain.com
# Certbot rewrites this file to add the TLS listener and an HTTP->HTTPS redirect.
