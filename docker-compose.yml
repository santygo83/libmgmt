services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: library_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: change-me
      DATABASE_URL: mysql+pymysql://library_user:library_pass@db/library_db
      FLASK_CONFIG: production
    ports:
      - "5000:5000"
    command: >
      sh -c "python -c 'from app import create_app; from app.extensions import db;
      app=create_app(\"production\"); app.app_context().push(); db.create_all()' &&
      gunicorn --bind 0.0.0.0:5000 run:app"

volumes:
  mysql_data:
